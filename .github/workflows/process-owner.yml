name: process-owner

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: process-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Comes from the template (docs/process/pull-requests.md): a pull request that needs the owner's OK has
# it, so the coordinator merges the rest on its own. It runs again when a review is given or dismissed.
jobs:
  process-owner:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The check runs from main's copy, isolated from the pull request's files, so a pull request can't
      # change the check that judges it; the workflow file itself is the owner's (.github/CODEOWNERS). The
      # first update that brings the check, while main has none, runs its own.
      - run: |
          if git cat-file -e "$BASE_SHA:tools/process/check_owner.py" 2>/dev/null; then
            git worktree prune
            git worktree add --quiet --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            python3 -I "$RUNNER_TEMP/base/tools/process/check_owner.py" "$GITHUB_EVENT_PATH"
          else
            python3 -I tools/process/check_owner.py "$GITHUB_EVENT_PATH"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
