name: process-owner

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  # to run again the runs earlier events left red (tools/process/check_owner.py, rerun_red)
  actions: write

# No concurrency group: the check takes seconds, and a run cancelled by a newer event would count as
# failed for the merge.
# Comes from the template (docs/process/pull-requests.md): a pull request that needs the owner's OK has
# it, so the coordinator merges the rest on its own. It runs again when a review is given or dismissed.
jobs:
  process-owner:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The check runs from the base branch's copy as it is now (the event's base.sha is where the base was
      # at the pull request's last push), isolated from the pull request's files, so a pull request can't
      # change the check that judges it; the workflow file itself is the owner's (.github/CODEOWNERS). The
      # first update that brings the check, while the base has none, runs its own.
      - run: |
          git fetch --quiet origin "refs/heads/$BASE_REF"
          if git cat-file -e "FETCH_HEAD:tools/process/check_owner.py" 2>/dev/null; then
            git worktree prune
            git worktree add --quiet --detach "$RUNNER_TEMP/base" FETCH_HEAD
            python3 -I "$RUNNER_TEMP/base/tools/process/check_owner.py" "$GITHUB_EVENT_PATH"
          else
            python3 -I tools/process/check_owner.py "$GITHUB_EVENT_PATH"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
