name: process-pr

# The checks of the description, the title and the labels: they run again when these change, without
# rerunning the checks of the content in process-checks.yml. A passing process-pr runs again the red runs
# of this workflow on the same commit, process-commits' among them.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  # to run again the runs earlier events left red (tools/process/check_pr.py)
  actions: write

# No concurrency group: a run cancelled by a newer event would count as failed for the merge. Each run
# reads the pull request as it is when it runs.

# These checks come from the template (docs/process/pull-requests.md); what they need and where they run
# is said in process-checks.yml.
jobs:
  process-pr:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/process/check_pr.py "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

  # The title becomes the subject of main's squash commit, so it is checked against the commit rules.
  process-commits:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/process/check_commits.py "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
