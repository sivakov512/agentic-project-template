name: process-pr

# The check of the description and the labels: it runs again when they change, without rerunning the
# checks of the content in process-checks.yml.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  # to run again the runs earlier events left red (tools/process/check_pr.py)
  actions: write

# No concurrency group: a run cancelled by a newer event would count as failed for the merge. Each run
# reads the pull request as it is when it runs.

# These checks come from the template (docs/process/pull-requests.md); what they need and where they run
# is said in process-checks.yml.
jobs:
  process-pr:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/process/check_pr.py "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
